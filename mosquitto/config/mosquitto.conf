# Broker MQTT — solo red local, con usuario y contraseña.
#
# Antes del primer arranque crea el usuario (te pedirá la contraseña):
#
#   docker run -it --rm -v ./mosquitto/config:/mosquitto/config \
#     eclipse-mosquitto:2 mosquitto_passwd -c /mosquitto/config/passwd casa
#
# Usa esa misma pareja usuario/contraseña en Home Assistant, en Frigate
# (frigate/config/config.yml) y en cada dispositivo ESPHome.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
