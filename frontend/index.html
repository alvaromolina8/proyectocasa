<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Panel local de demostración para controlar y visualizar tu casa."
    />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Casa — Panel de control</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación principal">
        <a class="brand" href="./index.html" aria-label="Casa, inicio">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="m3.5 10.5 8.5-7 8.5 7v9a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-9Z" />
              <path d="M9 20.5v-7h6v7M3.5 10.5 12 3.5l8.5 7" />
            </svg>
          </span>
          <span class="brand-name">casa<span>.</span></span>
        </a>

        <div class="side-label">MENÚ</div>
        <nav class="main-nav">
          <button class="nav-link is-active" type="button" data-view="home" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2" /><rect x="13.5" y="3.5" width="7" height="7" rx="2" /><rect x="3.5" y="13.5" width="7" height="7" rx="2" /><rect x="13.5" y="13.5" width="7" height="7" rx="2" /></svg>
            <span>Resumen</span>
          </button>
          <button class="nav-link" type="button" data-view="rooms">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V8l8-5 8 5v12M2.5 20h19M9 20v-6h6v6M8 9h.01M16 9h.01" /></svg>
            <span>Estancias</span>
          </button>
          <button class="nav-link" type="button" data-view="security">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z" /><path d="m9 12 2 2 4-4" /></svg>
            <span>Seguridad</span>
            <span class="nav-count">2</span>
          </button>
          <button class="nav-link" type="button" data-view="energy">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 10-12h-7l1-8Z" /></svg>
            <span>Energía</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="demo-note">
            <span class="demo-dot"></span>
            <div><strong>Modo demostración</strong><span>Datos de ejemplo</span></div>
          </div>
          <button class="profile-button" type="button" aria-label="Perfil de usuario">
            <span class="avatar">A</span>
            <span class="profile-copy"><strong>Mi casa</strong><span>Panel local</span></span>
            <svg class="profile-more" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Mi casa</span><span class="breadcrumb-divider">/</span><strong id="breadcrumb-current">Resumen</strong></div>
          <div class="topbar-actions">
            <span class="connection-status"><span class="status-dot"></span>Todo en orden</span>
            <button class="icon-button theme-button" type="button" data-action="theme" aria-label="Cambiar tema" title="Cambiar tema">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5a8.5 8.5 0 1 0 12 12Z" /></svg>
            </button>
            <button class="icon-button notification-button" type="button" data-action="notifications" aria-label="Ver notificaciones" title="Notificaciones">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" /></svg>
              <span class="notification-dot"></span>
            </button>
            <span class="top-avatar" aria-label="Perfil">A</span>
          </div>
        </header>
        <section id="dashboard" class="dashboard" aria-live="polite"></section>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </main>
    </div>
  </body>
</html>
